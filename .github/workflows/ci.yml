name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solution-and-tests:
    name: Solution and tests
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Clipora.sln --locked-mode

      - name: Audit NuGet dependencies
        run: dotnet list Clipora.sln package --vulnerable --include-transitive --no-restore

      # FFmpeg EXE не хранятся в Git; этот флаг исключает только их копирование, но компилирует WinUI-приложение и все библиотеки.
      - name: Build solution
        run: dotnet build Clipora.sln --configuration Release --no-restore -p:IncludeBundledMediaTools=false

      - name: Test solution
        run: dotnet test Clipora.sln --configuration Release --no-build --no-restore --logger "trx"
